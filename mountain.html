<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mountain Hiking Tours</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    body {
      background-color: var(--secondary-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: var(--white);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 600px;
    }
    .box h1 {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--text-dark);
    }
    ul.tour-list {
      list-style: disc;
      padding-left: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .tour-list li {
      background-color: #f5f5f5;
      padding: 1rem;
      border-radius: 8px;
    }
    .tour-title {
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .rating i {
      color: gold;
      font-size: 1rem;
    }
    .btn {
      margin-top: 0.5rem;
      display: inline-block;
      padding: 0.5rem 1rem;
      background-color: #3498db;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Mountain Hiking Tours</h1>
    <ul class="tour-list">
      <li>
        <div class="tour-title">Munnar</div>
        ₹14,999 • 5 days<br>
        <span class="rating"><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-half-line"></i></span><br>
        
      </li>
      <li>
        <div class="tour-title">Ooty & Kodaikanal</div>
        ₹11,500 • 4 days<br>
        <span class="rating"><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i></span><br>
        
      </li>
      <li>
        <div class="tour-title">Manali</div>
        ₹16,750 • 6 days<br>
        <span class="rating"><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-half-line"></i><i class="ri-star-line"></i></span><br>
        
      </li>
      <li>
        <div class="tour-title">Darjeeling</div>
        ₹1,35,000 • 8 days<br>
        <span class="rating"><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-half-line"></i><i class="ri-star-line"></i></span><br>
       
      </li>
      <li>
        <div class="tour-title">Ladkh</div>
        ₹39,000 • 3 days<br>
        <span class="rating"><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i><i class="ri-star-fill"></i></span><br>
        
      </li>
    </ul>
  </div>
  
</body>
</html>
